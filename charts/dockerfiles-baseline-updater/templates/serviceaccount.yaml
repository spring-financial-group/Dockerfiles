{{- if .Values.serviceAccount.create }}
# The job never talks to the Kubernetes API, so this has no RBAC and no mounted token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "baseline-updater.serviceAccountName" . }}
  labels:
    {{- include "baseline-updater.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
