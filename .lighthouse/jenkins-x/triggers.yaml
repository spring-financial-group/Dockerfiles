    source: "/python310/pr.yaml"
  - name: python310-torch-cpu-pr
    optional: false
    run_if_changed: (README.md|^.*python310-torch-cpu\/.*$)
    source: "/python310-torch-cpu/pr.yaml"
  - name: python310-torch-cuda-pr
    optional: false
    run_if_changed: (README.md|^.*python310-torch-cuda\/.*$)
    source: "/python310-torch-cuda/pr.yaml"
  - name: python314-pr
    optional: false
    run_if_changed: (README.md|^.*python314\/.*$)
    source: "/python314/pr.yaml"
  - name: nginx-pr
    optional: false
    run_if_changed: (README.md|^.*nginx\/.*$)
    source: "/nginx/pr.yaml"
  - name: node-pr
    optional: false
    run_if_changed: (README.md|^.*node\/.*$)
    source: "/node/pr.yaml"
  - name: node-unit-test-pr
    optional: false
    run_if_changed: (README.md|^.*node-unit-test\/.*$)
    source: "/node-unit-test/pr.yaml"
  - name: android-pr
    optional: false
    run_if_changed: (README.md|^.*android\/.*$)
    source: "/android/pr.yaml"
  - name: terratest-tfsec-pr
    optional: false
    run_if_changed: (README.md|^.*terratest-tfsec\/.*$)
    source: "/terratest-tfsec/pr.yaml"
  - name: tflint-pr
    optional: false
    run_if_changed: (README.md|^.*tflint\/.*$)
    source: "/tflint/pr.yaml"
  - name: net8-integration-tests-pr
    optional: false
    run_if_changed: (README.md|^.*net8-integration-tests\/.*$)
    source: "/net8-integration-tests/pr.yaml"
  - name: net8-sonar-pr
    optional: false
    run_if_changed: (README.md|^.*net8-sonar\/.*$)
    source: "/net8-sonar/pr.yaml"
  - name: net8-playwright
    optional: false
    run_if_changed: (README.md|^.*net8-playwright\/.*$)
    source: "/net8-playwright/pr.yaml"
  - name: chrome-for-testing-pr
    optional: false
    run_if_changed: (README.md|^.*chrome-for-testing\/.*$)
    source: "/chrome-for-testing/pr.yaml"
  - name: chrome-for-testing-golang-pr
    optional: false
    run_if_changed: (README.md|^.*chrome-for-testing-golang\/.*$)
    source: "/chrome-for-testing-golang/pr.yaml"
  - name: black-arch-pr
    optional: false
    run_if_changed: (README.md|^.*black-arch\/.*$)
    source: "/black-arch/pr.yaml"
  - name: bun-pr
    optional: false
    run_if_changed: (README.md|^.*bun\/.*$)
    source: "/bun/pr.yaml"
  - name: helmfile-pr
    optional: false
    run_if_changed: (README.md|^.*helmfile\/.*$)
    source: "/helmfile/pr.yaml"
  - name: golang-pipeline-pr
    optional: false
    run_if_changed: (README.md|^.*golang-pipeline\/.*$)
    source: "/golang-pipeline/pr.yaml"
  - name: lint-pipelines
    context: "lint-pipelines"
    run_if_changed: '.lighthouse\/jenkins-x\/.*'
    optional: false
    trigger: (?m)^/test( all| lint-pipelines.*),?(s+|$)
    rerun_command: /test lint-pipelines
    source: "lint-pipelines.yaml"
  postsubmits:
  - name: release
    source: "release.yaml"
    branches:
    - ^main$
    - ^master$
  - name: container-tools-release
    source: "/container-tools/release.yaml"
    branches:
    - ^main$
    - ^master$
