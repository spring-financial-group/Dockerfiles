apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
  - name: container-tools-pr
    optional: false
    run_if_changed: (README.md|^.*container-tools\/.*$)
    source: "dockerfile-pr.yaml"
    pipeline_run_params:
    - name: IMAGE_NAME
      value_template: container-tools
  - name: docksec-pr
    optional: false
    run_if_changed: (README.md|^.*docksec\/.*$)
    source: "dockerfile-pr.yaml"
    pipeline_run_params:
