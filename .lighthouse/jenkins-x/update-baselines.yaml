    - name: commit-baselines
      runAfter:
      - scan-all-sdks-alpine
      - scan-all-sdks-debian
      - scan-alpine3-24
      - scan-debian13-slim
      - scan-nginx-stable-alpine
      - scan-squid
      - scan-ubuntu26
      - scan-chrome-for-testing
      - scan-chrome-for-testing-golang
      - scan-dotnet-aspnet-10
      - scan-dotnet-aspnet-10-ubuntu
      - scan-dotnet-playwright-10
      - scan-dotnet-sdk-10
      - scan-dotnet-sdk-10-ubuntu
      - scan-net10-sonar
      - scan-distroless-static-debian13
      - scan-distroless-static-nonroot
      - scan-android
      - scan-bun
      - scan-nginx
      - scan-node
      - scan-node-debian13-slim
      - scan-node-unit-test
      - scan-golang-pipeline
      - scan-gradle9-jdk17-alpine
      - scan-openjdk17-alpine
      - scan-python310
      - scan-python310-torch-cpu
      - scan-python310-torch-cuda
      - scan-python314
      - scan-black-arch
      - scan-docksec
      - scan-terratest-tfsec
      - scan-tflint
      - scan-baseline-updater
      - scan-container-tools
      - scan-helmfile
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        steps:
        - image: jx3mqubebuild.azurecr.io/spring-financial-group/container-tools:latest
          name: commit-and-pr
          resources: {}
          workingDir: /workspace/source
          env:
          - name: HOME
            value: /tekton/home
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
          script: |
            #!/bin/bash
            set -euo pipefail
            git config --global --add safe.directory "$PWD"
            cat .baseline-run/failed/* > /tmp/failed-images 2>/dev/null || true
            FAILED_FILE=/tmp/failed-images scripts/update-baselines-pr.sh
  workspaces:
  - name: source
    volumeClaimTemplate:
      spec:
        storageClassName: azurefile-csi-premium
        accessModes:
        - ReadWriteMany
        resources:
          requests:
            storage: 5Gi
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 3h0m0s
