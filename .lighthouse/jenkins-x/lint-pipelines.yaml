apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
    name: lint-pipelines
spec:
    pipelineSpec:
        tasks:
        - name: from-build-pack
          resources: {}
          taskSpec:
              metadata: {}
              stepTemplate:
                  image: uses:jenkins-x/jx3-pipeline-catalog/tasks/go/pullrequest.yaml@versionStream
                  name: ""
                  resources:
                      limits: {}
                  workingDir: /workspace/source
              steps:
              - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
                name: ""
                resources: {}
              - name: jx-variables
                resources: {}
              - image: uses:spring-financial-group/mqube-pipeline-catalog/tasks/tools/jx-pipeline-linter.yaml@main
                name: ""
                resources: {}
              - image: jx3mqubebuild.azurecr.io/spring-financial-group/container-tools:latest
                name: dockerfile-triggers
                resources: {}
                script: |
                    #!/bin/bash
                    set -e
                    git config --global --add safe.directory "$PWD"
                    scripts/generate-triggers.sh
                    git diff --exit-code -- .lighthouse/jenkins-x/triggers.yaml || { echo "triggers.yaml is out of date, run scripts/generate-triggers.sh and commit the result"; exit 1; }
    podTemplate: {}
    serviceAccountName: tekton-bot
    timeout: 1h0m0s
status: {}
