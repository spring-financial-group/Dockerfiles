apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: update-baseline-dockerfiles
spec:
  pipelineSpec:
    params:
    - name: IMAGE_DIR
      description: The repo-relative directory containing the image's Dockerfile
      type: string
      default: none
    tasks:
    - name: from-build-pack
      params:
      - name: IMAGE_DIR
        value: $(params.IMAGE_DIR)
      resources: {}
      taskSpec:
        metadata: {}
        params:
        - name: IMAGE_DIR
          description: The repo-relative directory containing the image's Dockerfile
          type: string
          default: none
        stepTemplate:
          image: uses:jenkins-x/jx3-pipeline-catalog/tasks/docker/pullrequest.yaml@versionStream
          name: ""
          resources:
            # override limits for all containers here
            limits: {}
          workingDir: /workspace/source
          volumeMounts:
          - mountPath: /temp-docker-config
            name: temp-docker-config
          env:
          - name: HOME
            value: /tekton/home
          - name: TRIVY_CACHE_DIR
            value: /tekton/home/.cache/trivy
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - name: jx-variables
          resources: {}
        - image: jx3mqubebuild.azurecr.io/gcr-io/kaniko-project/executor:v1.24.0-debug
          name: build-containers
          resources: {}
          script: |
            #!/busybox/sh
            set -ex
            source .jx/variables.sh
            cp /temp-docker-config/config.json /kaniko/.docker/config.json

            IMAGE_NAME=$(basename "$(params.IMAGE_DIR)")
            /kaniko/executor $KANIKO_FLAGS --cleanup --context=/workspace/source/"$(params.IMAGE_DIR)" --dockerfile="Dockerfile" --destination=$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/"$IMAGE_NAME":$VERSION --no-push --tarPath "$IMAGE_NAME".tar
        - image: jx3mqubebuild.azurecr.io/ghcr-io/jenkins-x/trivydb:latest
          name: copy-vulns-db
          resources: { }
          script: |
            #!/bin/sh
            mkdir -p "$TRIVY_CACHE_DIR"
            mv /trivydb/* "$TRIVY_CACHE_DIR/"
        - image: jx3mqubebuild.azurecr.io/spring-financial-group/docksec:latest
          name: update-baseline
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -eo pipefail
            . .jx/variables.sh
            export DOCKER_HOST=tcp://localhost:2375

            IMAGE_NAME=$(basename "$(params.IMAGE_DIR)")

            until docker info >/dev/null 2>&1; do echo "waiting for docker daemon…"; sleep 3; done

            docker load -i "$IMAGE_NAME".tar
            rm -f "$IMAGE_NAME".tar

            # Same Trivy DB as the PR pipeline, so the baseline matches what the PR gate sees.
            OFFLINE=1 scripts/update-baseline.sh "$(params.IMAGE_DIR)" \
              "$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$IMAGE_NAME:$VERSION" | tee "$HOME/baseline-summary.txt"
        - image: jx3mqubebuild.azurecr.io/spring-financial-group/container-tools:latest
          name: commit-baseline
          resources: {}
          script: |
            #!/bin/bash
            set -eo pipefail
            git config --global --add safe.directory "$PWD"

            IMAGE_NAME=$(basename "$(params.IMAGE_DIR)")
            BASELINE="$(params.IMAGE_DIR)/.docksec-baseline.json"
            SUMMARY=$(cat "$HOME/baseline-summary.txt")

            # git-clone-pr leaves the PR merged onto main, so look up the PR's own branch to commit to.
            export GH_TOKEN=${GH_TOKEN:-$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill | sed -n 's/^password=//p')}
            PR_JSON=$(gh api "repos/$REPO_OWNER/$REPO_NAME/pulls/$PULL_NUMBER")
            HEAD_REF=$(jq -r '.head.ref' <<<"$PR_JSON")
            HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")

            comment() {
              gh pr comment "$PULL_NUMBER" --repo "$REPO_OWNER/$REPO_NAME" --body "$1" || true
            }

            if [ "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" != "$REPO_OWNER/$REPO_NAME" ]; then
              comment "/update-baseline $IMAGE_NAME: can't push to a fork. Run \`scripts/update-baseline.sh $(params.IMAGE_DIR)\` locally and push the result."
              exit 1
            fi
            if [ "$HEAD_SHA" != "$PULL_PULL_SHA" ]; then
              comment "/update-baseline $IMAGE_NAME: the PR moved on since this job started ($PULL_PULL_SHA → $HEAD_SHA). Comment again to regenerate against the latest commit."
              exit 1
            fi

            cp "$BASELINE" /tmp/baseline.json
            git fetch origin "$HEAD_REF"
            git checkout -B "$HEAD_REF" FETCH_HEAD
            cp /tmp/baseline.json "$BASELINE"

            git add "$BASELINE"
            if git diff --cached --quiet; then
              comment "/update-baseline $IMAGE_NAME: baseline already up to date. $SUMMARY"
              exit 0
            fi

            git -c user.name="${GIT_AUTHOR_NAME:-jenkins-x-bot}" -c user.email="${GIT_AUTHOR_EMAIL:-jenkins-x@googlegroups.com}" \
              commit -m "chore(security): update docksec baseline for $IMAGE_NAME"
            # /update-baseline all pushes one commit per image to the same branch, so rebase on a lost race.
            for attempt in 1 2 3; do
              git push origin "HEAD:refs/heads/$HEAD_REF" && break
              [ "$attempt" -lt 3 ] || exit 1
              git pull --rebase origin "$HEAD_REF"
            done

            comment "/update-baseline $IMAGE_NAME: pushed $(git rev-parse --short HEAD). $SUMMARY"
        sidecars:
        - name: docker-daemon
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
          volumeMounts:
          - mountPath: /var/lib/docker
            name: docker-lib
        volumes:
        - name: temp-docker-config
          secret:
            secretName: tekton-temp-registry-auth
            items:
            - key: .dockerconfigjson
              path: config.json
        - name: docker-lib
          emptyDir: {}
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
