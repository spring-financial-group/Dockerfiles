    optional: false
    run_if_changed: (README.md|^.*golang-pipeline\/.*$)
    source: "dockerfile-pr.yaml"
    pipeline_run_params:
    - name: IMAGE_NAME
      value_template: golang-pipeline
  - name: lint-pipelines
    context: "lint-pipelines"
    run_if_changed: '.lighthouse\/jenkins-x\/.*'
    optional: false
    trigger: (?m)^/test( all| lint-pipelines.*),?(s+|$)
    rerun_command: /test lint-pipelines
    source: "lint-pipelines.yaml"
  postsubmits:
  - name: release
    source: "release.yaml"
    branches:
    - ^main$
    - ^master$
  - name: container-tools-release
    source: "dockerfile-release.yaml"
    branches:
    - ^main$
    - ^master$
    pipeline_run_params:
