apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: net8-playwright-pr
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:jenkins-x/jx3-pipeline-catalog/tasks/docker/pullrequest.yaml@versionStream
          name: ""
          resources:
            # override limits for all containers here
            limits: {}
          workingDir: /workspace/source
          volumeMounts:
          - mountPath: /temp-docker-config
            name: temp-docker-config
          env:
          - name: IMAGE_NAME
            value: net8-playwright
          - name: HOME
            value: /tekton/home
          - name: TRIVY_CACHE_DIR
            value: /tekton/home/.cache/trivy
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: security-alerts
                key: slack-sec-alerts-webhook
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - name: jx-variables
          resources: {}
        - image: gcr.io/kaniko-project/executor:v1.8.0-debug
          name: build-containers
          resources: {}
          script: |
            #!/busybox/sh
            set -e
            source .jx/variables.sh
            cp /temp-docker-config/config.json /kaniko/.docker/config.json

            /kaniko/executor $KANIKO_FLAGS --cleanup --context=/workspace/source/$IMAGE_NAME --dockerfile="Dockerfile" --destination=$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$IMAGE_NAME:$VERSION --no-push --tarPath $IMAGE_NAME.tar
        - image: ghcr.io/jenkins-x/trivydb:latest
          name: copy-vulns-db
          resources: {}
          script: |
            #!/bin/sh
            mkdir -p "$TRIVY_CACHE_DIR"
            mv /trivydb/* "$TRIVY_CACHE_DIR/"
        - image: jx3mqubebuild.azurecr.io/spring-financial-group/docksec:latest
          name: docksec-scan
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            . .jx/variables.sh
            export DOCKER_HOST=tcp://localhost:2375

            until docker info >/dev/null 2>&1; do echo "waiting for docker daemon…"; sleep 3; done

            docker load -i $IMAGE_NAME.tar
            docker tag "$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$IMAGE_NAME:$VERSION" "$IMAGE_NAME:$VERSION"

            set +e
            docksec \
              -i "$IMAGE_NAME:$VERSION" \
              --image-only \
              --no-color \
              --offline \
              --format json \
              --ignore-file "$IMAGE_NAME/.docksec-ignore.yml" \
              --fail-on high
            DOCKSEC_EXIT=$?
            set -e

            safe_name=$(printf '%s' "$IMAGE_NAME:$VERSION" | tr ':/.-' '_')
            JSON_REPORT="$HOME/.docksec/results/${safe_name}_scan_results.json"
            if [ -s "$JSON_REPORT" ]; then
              cp "$JSON_REPORT" /tmp/docksec.json
            else
              echo "docksec JSON report not found at $JSON_REPORT" >&2
              echo '{}' > /tmp/docksec.json
            fi

            VULN_ROWS=$(yq -r '
              .vulnerabilities[]?
              | select(
              (.Severity | downcase) == "critical"
              or (.Severity | downcase) == "high"
              )
              | [
              (.Severity | upcase),
              (.VulnerabilityID // "Unknown vulnerability"),
              (.PkgName // "Unknown package"),
              (.Target // "Unknown target"),
              ((.FixedVersion // "") | select(. != "") // "No fix reported"),
              ((.PrimaryURL // "") | select(. != "") // "No URL")
            ]
              | @tsv
              ' /tmp/docksec.json)

            if [ -n "$VULN_ROWS" ]; then
              printf '%s\n' "$VULN_ROWS" | awk -F '\t' '
                BEGIN {
                  printf "%-10s | %-50s | %-30s | %-40s | %s\n", "Severity", "CVE", "Package", "Target", "Fixed"
                  print "-----------+----------------------------------------------------+--------------------------------+------------------------------------------+---------------------"
                }
                {
                  # use URL when available, otherwise fallback to CVE ID
                  cve = ($6 ~ /^http/) ? $6 : $2
                  printf "%-10s | %-50s | %-30s | %-40s | %s\n", $1, cve, $3, $4, $5
                }'

              PIPELINE_NAME=$(context.pipeline.name)
              PIPELINE_RUN_NAMESPACE=$(context.pipelineRun.namespace)
              TEKTON_URL=https://tekton-dashboard.jx.mqube.build/#/namespaces/$PIPELINE_RUN_NAMESPACE/pipelineruns/$PIPELINE_NAME
              PR_URL=${REPO_URL%.git}/pull/$PULL_NUMBER
              curl -s -X POST --data-urlencode "payload={\"channel\": \"#alerts-security\", \"username\": \"secalerts\", \"text\": \"VULNERABILITIES FOUND in $IMAGE_NAME:$VERSION\n• PR: <$PR_URL|PR#$PULL_NUMBER>\n• Logs available <$TEKTON_URL|here>\", \"icon_emoji\": \":shield:\"}" "$SLACK_WEBHOOK_URL" > /dev/null || true
            else
              echo "No medium-or-higher vulnerabilities found."
            fi
            echo

            exit $DOCKSEC_EXIT
        - image: jx3mqubebuild.azurecr.io/spring-financial-group/container-tools:latest
          name: push-sign-verify-containers
          resources: {}
          script: |
            #!/bin/bash
            set -e
            source .jx/variables.sh
            cp /temp-docker-config/config.json ~/.docker/config.json
            IMAGE_REF=$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$IMAGE_NAME:$VERSION
            crane push /workspace/source/$IMAGE_NAME.tar $IMAGE_REF
            IMAGE_DIGEST=$(crane digest $IMAGE_REF)
            IMAGE_WITH_DIGEST=$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$IMAGE_NAME@$IMAGE_DIGEST
            cosign sign --yes --key k8s://jx-staging/cosign $IMAGE_WITH_DIGEST
            cosign verify --key k8s://jx-staging/cosign $IMAGE_WITH_DIGEST
            rm -f /workspace/source/$IMAGE_NAME.tar /workspace/source/scanresults.txt
        sidecars:
        - name: docker-daemon
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
          volumeMounts:
          - mountPath: /var/lib/docker
            name: docker-lib
        volumes:
        - name: temp-docker-config
          secret:
            secretName: tekton-temp-registry-auth
            items:
            - key: .dockerconfigjson
              path: config.json
        - name: docker-lib
          emptyDir: {}
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
