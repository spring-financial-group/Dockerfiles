    - ^master$
  - name: python310-torch-cuda-release
    source: "/python310-torch-cuda/release.yaml"
    branches:
    - ^main$
    - ^master$
  - name: python314-release
    source: "/python314/release.yaml"
    branches:
    - ^main$
